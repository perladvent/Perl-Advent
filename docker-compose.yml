---
services:
  perl-advent:
    build:
      context: .
      dockerfile: Dockerfile
    image: perl-advent:latest
    volumes:
      - .:/app
      - build-output:/app/out  # Use named volume so rm -rf won't affect host
    command: >
      bash -c "
        echo 'Building Perl Advent Calendar site...' &&
        bash script/build-site.sh &&
        echo 'Build complete! Site is available in the ./out directory'
      "

  perl-advent-server:
    image: perl-advent:latest
    ports:
      - '7007:7007'
    volumes:
      - build-output:/app/out  # Share the same named volume
    working_dir: /app/out
    command: http_this --port 7007 --autoindex
    init: true
    tty: true
    stdin_open: true
    depends_on:
      - perl-advent

  # Single-article preview: `make preview-docker ARTICLE=...`. Saving the
  # article syncs it in and re-renders it (Compose Watch, Compose >= 2.32).
  preview:
    profiles: [preview]
    build:
      context: .
      dockerfile: Dockerfile
    image: perl-advent:latest
    ports:
      - '${PREVIEW_PORT:-8026}:${PREVIEW_PORT:-8026}'
    volumes:
      - ./out:/app/out  # Bind mount so the preview lands on the host
    environment:
      ARTICLE: ${ARTICLE:-}
      PREVIEW_PORT: ${PREVIEW_PORT:-8026}
    command: >
      bash -c '
        bash script/build-site.sh &&
        bash script/preview-article.sh "$$ARTICLE" &&
        exec http_this out --host 0.0.0.0 --port "$$PREVIEW_PORT" --autoindex
      '
    init: true
    develop:
      watch:
        # Compose validates every service, and rejects a blank path even unused.
        - action: sync+exec
          path: ${ARTICLE:-ARTICLE-not-set}
          target: /app/${ARTICLE:-}
          exec:
            command: bash script/preview-article.sh ${ARTICLE:-}

volumes:
  build-output:  # Named volume persists between runs
