<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800&family=Source+Code+Pro:wght@500&display=swap');
html,body{margin:0;padding:0}</style>
</head><body>
<div id="ogcard" style="width:1200px;height:630px;position:relative;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;
  background:
    radial-gradient(2px 2px at 12% 26%,rgba(255,255,255,.9),transparent),
    radial-gradient(1.6px 1.6px at 24% 62%,rgba(255,255,255,.6),transparent),
    radial-gradient(2.4px 2.4px at 40% 18%,rgba(255,255,255,.85),transparent),
    radial-gradient(1.6px 1.6px at 58% 48%,rgba(255,255,255,.55),transparent),
    radial-gradient(2px 2px at 72% 24%,rgba(255,255,255,.8),transparent),
    radial-gradient(1.6px 1.6px at 86% 60%,rgba(255,255,255,.6),transparent),
    radial-gradient(2.2px 2.2px at 90% 32%,rgba(255,255,255,.75),transparent),
    linear-gradient(160deg,#0b1826,#132a44 60%,#0e2136)">
  <div style="position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#1a6b3c 0 40px,#c0362c 40px 80px,#f2b441 80px 120px)"></div>
  <div style="position:absolute;top:96px;right:92px;display:grid;grid-template-columns:repeat(3,84px);gap:16px">
    <div style="aspect-ratio:1/1.05;border-radius:14px;background:linear-gradient(150deg,#c0362c,#7a1f14);position:relative;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)"><div style="position:absolute;top:0;bottom:0;left:50%;width:7px;transform:translateX(-50%);background:#f2b441"></div><div style="position:absolute;left:0;right:0;top:50%;height:7px;transform:translateY(-50%);background:#f2b441"></div></div>
    <div style="aspect-ratio:1/1.05;border-radius:14px;background:linear-gradient(150deg,#155e37,#0e3f25);position:relative;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)"><div style="position:absolute;top:0;bottom:0;left:50%;width:7px;transform:translateX(-50%);background:#f2b441"></div><div style="position:absolute;left:0;right:0;top:50%;height:7px;transform:translateY(-50%);background:#f2b441"></div></div>
    <div style="aspect-ratio:1/1.05;border-radius:14px;background:linear-gradient(150deg,#1e3a5f,#122a44);position:relative;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)"><div style="position:absolute;top:0;bottom:0;left:50%;width:7px;transform:translateX(-50%);background:#c0362c"></div><div style="position:absolute;left:0;right:0;top:50%;height:7px;transform:translateY(-50%);background:#c0362c"></div></div>
    <div style="aspect-ratio:1/1.05;border-radius:14px;background:linear-gradient(150deg,#c98a1e,#8f5f12);position:relative;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)"><div style="position:absolute;top:0;bottom:0;left:50%;width:7px;transform:translateX(-50%);background:#fffdf7"></div><div style="position:absolute;left:0;right:0;top:50%;height:7px;transform:translateY(-50%);background:#fffdf7"></div></div>
    <div style="aspect-ratio:1/1.05;border-radius:14px;background:radial-gradient(circle at 50% 38%,#fbe3a6,#e0962a);position:relative;box-shadow:0 0 0 3px #f2b441,0 10px 24px -10px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center"><span style="font-family:'Bebas Neue';font-size:56px;color:#16304d;line-height:1">24</span></div>
    <div style="aspect-ratio:1/1.05;border-radius:14px;background:linear-gradient(150deg,#155e37,#0e3f25);position:relative;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)"><div style="position:absolute;top:0;bottom:0;left:50%;width:7px;transform:translateX(-50%);background:#f2b441"></div><div style="position:absolute;left:0;right:0;top:50%;height:7px;transform:translateY(-50%);background:#f2b441"></div></div>
  </div>
  <div style="position:absolute;top:70px;left:80px;display:flex;gap:20px">
    <span style="width:14px;height:14px;border-radius:50%;background:#c0362c;box-shadow:0 0 14px #c0362c"></span>
    <span style="width:14px;height:14px;border-radius:50%;background:#f2b441;box-shadow:0 0 14px #f2b441"></span>
    <span style="width:14px;height:14px;border-radius:50%;background:#2e9d5b;box-shadow:0 0 14px #2e9d5b"></span>
    <span style="width:14px;height:14px;border-radius:50%;background:#c0362c;box-shadow:0 0 14px #c0362c"></span>
  </div>
  <div style="position:absolute;left:80px;bottom:150px">
    <div style="font-family:'Bebas Neue';font-size:118px;line-height:.92;letter-spacing:.01em;color:#fff">Perl Advent<br><span style="color:#f2b441">Calendar</span></div>
  </div>
  <div style="position:absolute;left:84px;bottom:96px;font-family:'Source Code Pro',monospace;font-size:22px;letter-spacing:.18em;color:#9fc0dd">TWENTY-FOUR MERRY DAYS OF PERL</div>
  <div style="position:absolute;left:84px;bottom:56px;font-family:'Outfit';font-weight:700;font-size:26px;color:#fff">December 2026 &nbsp;·&nbsp; <span style="color:#f2b441">perladvent.org</span></div>
</div>
</body></html>
