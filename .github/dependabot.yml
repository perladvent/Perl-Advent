version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    # Check for updates to GitHub Actions on the 27th of each month, only
    # while the project is active (July through February)
    interval: "cron"
    cronjob: "0 9 27 1,2,7-12 *"
  groups:
    major-updates:
      patterns:
        - "*"
      update-types:
        - "major"
    minor-and-patch:
      patterns:
        - "*"
      update-types:
        - "minor"
        - "patch"
  cooldown:
    default-days: 7
