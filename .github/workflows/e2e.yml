---
name: E2E (advent.js)

# End-to-end coverage for the 2026 progressive-enhancement script.
# The screenshot workflow only runs for labelled article (.pod) changes, so a
# JS-only edit to advent.js would otherwise ship with no automated check.

on:
  push:
    branches:
      - main
    paths: &e2e-paths
      - '2026/share/static/**'
      - '2026/share/templates/**'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'script/uat-preview.sh'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths: *e2e-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Build Docker image
        run: docker compose build

      - name: 📚 Build UAT preview (out/2026)
        run: |
          # advcal + the inc/ forks live in the image; render the fixture
          # calendar (max doors open) into the build-output volume.
          docker compose run --rm perl-advent bash script/uat-preview.sh 2026-12-25
          # out is a named volume, not a host bind mount — copy it onto the
          # bind-mounted workspace so the host-side Playwright run can serve it.
          docker compose run --rm perl-advent cp -r /app/out /app/out-host
          rm -rf out
          mv out-host out

      - name: 🎭 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: 🧪 Run e2e tests
        run: npx playwright test

      - name: 📤 Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
