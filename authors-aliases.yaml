# authors-aliases.yaml
#
# Author-name normalization for the "by author" archives page.
#
# The Author: header in each article's POD is free-form, author-supplied data.
# Before grouping articles by author, mkarchives/backfill-authors.pl normalize
# each header value:
#
#   1. Strip a trailing "<email>" or "(email)" from the value.
#   2. Trim and collapse internal whitespace.
#   3. If nothing remains (an email-only header), keep the email as the name.
#   4. Case/spacing variants are merged via a fold-case grouping key.
#
# That handles most variants automatically (e.g. "Name  <email>" vs
# "Name <email>", or "Name" vs "name"). This file covers what normalization
# alone cannot: the SAME person appearing under genuinely different name
# strings -- most often an email-only header for someone who also published
# under their name, or a differently-spelled name.
#
# Format: a YAML map of  variant-string: "Canonical Display Name"
# The variant may be a full raw Author: value (e.g. an email) or a derived
# display name. Matching is case- and whitespace-insensitive. Only add an
# entry you can justify from the data (e.g. a shared email proving identity).

# Olaf Alders published some articles with an email-only header.
"olaf@wundersolutions.com": "Olaf Alders"

# Ricardo Signes -- a header uses all-caps SIGNES.
"Ricardo SIGNES": "Ricardo Signes"

# Same person (shared email mohammad.anwar@yahoo.com), three name spellings.
"Mohammad Anwar": "Mohammad Sajid Anwar"
"Mohammad S Anwar": "Mohammad Sajid Anwar"
